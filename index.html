function calcRealSunTimes(lat, lon, date = new Date()) {
  const rad = Math.PI / 180;
  const start = new Date(date.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((date - start) / DAY);
  const gamma = (2 * Math.PI / 365) * (dayOfYear - 1);

  const eqTime = 229.18 * (0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma) - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma));
  const decl = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma) - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma);

  const cosHA = (Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl))) - Math.tan(lat * rad) * Math.tan(decl);
  const ha = Math.acos(Math.max(-1, Math.min(1, cosHA))) / rad;

  // Offset real del dispositivo (incluye horario de verano / invierno automáticamente)
  const tzOffsetMin = -date.getTimezoneOffset();
  const sunriseMin = 720 - 4 * (lon + ha) - eqTime + tzOffsetMin;
  const sunsetMin = 720 - 4 * (lon - ha) - eqTime + tzOffsetMin;
  const goldenMin = sunsetMin - 42;

  const fmt = m => {
    const tot = ((Math.round(m) % 1440) + 1440) % 1440;
    const hh = String(Math.floor(tot / 60)).padStart(2, "0");
    const mm = String(tot % 60).padStart(2, "0");
    return `${hh}:${mm}`;
  };
  return { sunrise: fmt(sunriseMin), sunset: fmt(sunsetMin), golden: fmt(goldenMin) };
}

function exportToGoogleCalendar(title, daysFromNow, girlName) {
  const targetDate = new Date(Date.now() + daysFromNow * DAY);
  const ymd = targetDate.toISOString().slice(0, 10).replace(/-/g, "");
  // Texto discreto como pidió el usuario: "Mirar detalle Vanesa"
  const discreetTitle = encodeURIComponent(`Mirar detalle ${girlName} (${title})`);
  const details = encodeURIComponent(`Recordatorio privado generado por Barney.`);
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${discreetTitle}&dates=${ymd}/${ymd}&details=${details}`;
  window.open(url, "_blank");
  toast(`Abriendo Google Calendar: "Mirar detalle ${girlName}"`);
}

function downloadICS(title, daysFromNow, girlName) {
  const targetDate = new Date(Date.now() + daysFromNow * DAY);
  const ymd = targetDate.toISOString().slice(0, 10).replace(/-/g, "");
  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "BEGIN:VEVENT",
    `DTSTART;VALUE=DATE:${ymd}`,
    `DTEND;VALUE=DATE:${ymd}`,
    `SUMMARY:Mirar detalle ${girlName} (${title})`,
    "DESCRIPTION:Recordatorio privado de Barney",
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `recordatorio-${girlName.toLowerCase()}.ics`;
  a.click();
  toast(`Guardado en tu Calendario: "Mirar detalle ${girlName}"`);
}

function sendRealNotif(title, body) {

    if (Notification.permission === "granted") {

      Notification.requestPermission().then(p => {
        if (p === "granted") new Notification(title, { body });
      });
    }
  }
}

function copy(t){ if(navigator.clipboard) navigator.clipboard.writeText(t); toast("Texto copiado"); }

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let tt;
function toast(m, actionLabel, actionFn){
  const e = document.getElementById("toast");
  if(!e) return;
  const isHTML = typeof m === 'string' && m.startsWith('__HTML__');
  const safeText = isHTML ? m.slice(8) : esc(m);
  const actionBtn = (actionLabel && actionFn) ? `<button onclick="${actionFn}" class="tap px-2.5 py-1 rounded-xl bg-sky-400 text-slate-950 text-xs font-extrabold shrink-0 shadow-sm">${esc(actionLabel)}</button>` : '';
  e.innerHTML = `<div class="flex items-center justify-between gap-2.5 w-full"><span class="truncate">${safeText}</span>${actionBtn}</div>`;
  e.classList.remove("hidden");
  clearTimeout(tt);
  tt = setTimeout(() => e.classList.add("hidden"), actionLabel ? 5000 : 3200);
}

function useRealGPS() {
  if (!navigator.geolocation) { toast("GPS no disponible en este navegador"); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    S.customCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    S.city = "Mi GPS";
    save(); render();
    toast("Ubicación GPS real sincronizada");
  }, () => toast("Usando coordenadas de " + S.city));
}

function exportBackup() {
  const data = JSON.stringify(S, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "barney-backup-" + iso(new Date()) + ".json";
  a.click();
  toast("Copia de seguridad descargada");
}

function restoreFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data && Array.isArray(data.girls) && data.girls.length > 0) {
        S = Object.assign(S, data);
        sanitizeData();
        save(); closeSheet(); render();
        toast("¡Copia de seguridad restaurada y verificada!");
      } else {
        toast("Formato de copia no válido");
      }
    } catch(err) { toast("Archivo no válido o dañado"); }
  };
  reader.readAsText(file);
}

 return set[vOff%set.length];
}

function ensureAnalytics(){
 S.analytics=S.analytics||{
  views:{hoy:1,ella:0,ideas:0,ajustes:0},
  actions:{capture:0,sos:0,socialIA:0,surpriseGift:0,customFieldAdded:0,concertSearch:0},
  sectionOpens:{favs:0,sizes:0,more:0,wish:0,events:0,cycle:0},
  customFieldsLog:[],
  captureHistory:[],
  suggestions:[]
 };
 S.analytics.sectionOpens=S.analytics.sectionOpens||{favs:0,sizes:0,more:0,wish:0,events:0,cycle:0};
 S.analytics.captureHistory=S.analytics.captureHistory||[];
 S.analytics.suggestions=S.analytics.suggestions||[];
}
function trackEvent(type,key,detail){
 ensureAnalytics();
 if(type==='view')S.analytics.views[key]=(S.analytics.views[key]||0)+1;
 if(type==='action')S.analytics.actions[key]=(S.analytics.actions[key]||0)+1;
 if(type==='secOpen')S.analytics.sectionOpens[key]=(S.analytics.sectionOpens[key]||0)+1;
 if(type==='customField'&&detail){
  S.analytics.actions.customFieldAdded=(S.analytics.actions.customFieldAdded||0)+1;
  if(!S.analytics.customFieldsLog.includes(detail))S.analytics.customFieldsLog.unshift(detail);
 }
 if(type==='captureLog'&&detail){
  S.analytics.captureHistory.unshift(detail);
  if(S.analytics.captureHistory.length>25)S.analytics.captureHistory.pop();
 }
 if(type==='suggestion'&&detail){
  S.analytics.suggestions.unshift({text:detail,date:iso(new Date())});
 }
 save();
}

/* =========================================================================
   3. CLASIFICADOR ESQUEMATIZADO EN VIVO PARA «+ APUNTAR» (SUPER PRECISO)
   Ej: "mi anillo es la talla 18" -> Tallas -> Anillo = "Talla 18"
   ========================================================================= */
let _capOverride=null;

function parseSmartCapture(raw){
 const s=(raw||'').trim();
 if(!s)return null;
 const l=s.toLowerCase();

 // 1. Formato directo "Apartado: Valor"
 if(s.includes(':')){
  const parts=s.split(':'),k=parts[0].trim(),v=parts.slice(1).join(':').trim();
  if(k&&v){
   if(/molesta|odia|no soporta/i.test(k))return {bucket:'more',key:'Le molesta',val:v,label:'Su mundo → Le molesta'};
   if(/anillo/i.test(k))return {bucket:'sizes',key:'Anillo',val:v,label:'Tallas → Anillo'};
   if(/calzado|zapato|pie/i.test(k))return {bucket:'sizes',key:'Calzado',val:v,label:'Tallas → Calzado'};
   if(/talla|pantal|camiset|vestido|sujetador/i.test(k))return {bucket:'sizes',key:k,val:v,isCustom:!SLOTS.sizes.includes(k),label:`Tallas → ${k}`};
   if(/concierto|entrada|evento|show|programa|teatro/i.test(k))return {bucket:'events',key:'Conciertos y Eventos',val:v,city:detectCity(s),label:`Conciertos y Eventos (${detectCity(s)})`};
   if(/regalo|deseo|quiere/i.test(k))return {bucket:'wish',key:'Lista de Regalos',val:v,label:'Lista de Regalos'};
   return {bucket:'favs',key:k,val:v,isCustom:!SLOTS.favs.includes(k),label:`Gustos → ${k}`};
  }
 }

 // 2. Detección inteligente de TALLAS expresadas en lenguaje natural ("mi anillo es la talla 18", "usa un 38 de pie", "pantalón 36", "vestido talla S")
 if(/\banillos?\b/i.test(l)){
  const num=s.match(/\b(\d{1,2}(?:[.,]\d)?)\b/);
  const val=num?`Talla ${num[1]}`:(s.replace(/^(mi|su|el|usa|tiene)?\s*anillos?\s*(es)?\s*(la|el|de)?\s*/i,'').trim()||s);
  return {bucket:'sizes',key:'Anillo',val:val.charAt(0).toUpperCase()+val.slice(1),label:'Tallas → Anillo'};
 }
 if(/\b(calzado|zapatos?|zapatillas?|botas?|pie|calza)\b/i.test(l)){
  const num=s.match(/\b(3[4-9]|4[0-3])(?:[.,]5)?\b/);
  const val=num?`${num[0]} EU`:(s.replace(/^(mi|su|el|usa|calza)?\s*(calzado|zapatos?|pie)\s*(es|del|de|talla|n[uú]mero)?\s*/i,'').trim()||s);
  return {bucket:'sizes',key:'Calzado',val,label:'Tallas → Calzado'};
 }
 if(/\b(pantal[oó]n|pantalones|vaqueros?|jeans)\b/i.test(l)){
  const num=s.match(/\b(3[2-9]|4[0-6]|xs|s|m|l|xl)\b/i);
  const val=num?`Talla ${num[0].toUpperCase()}`:s;
  return {bucket:'sizes',key:'Pantalón',val,label:'Tallas → Pantalón'};
 }
 if(/\b(sujetador|copa)\b/i.test(l)){
  const m=s.match(/\b(\d{2,3}\s*[a-dA-D])\b/);
  const val=m?m[1].toUpperCase():s.replace(/^sujetador\s*(talla|es)?\s*/i,'').trim();
  return {bucket:'sizes',key:'Sujetador',val,isCustom:true,label:'Tallas → Sujetador'};
 }
 if(/\b(vestidos?|camisetas?|tops?|blusas?|ropa|talla)\b/i.test(l)){
  const m=s.match(/\b(xxs|xs|s|m|l|xl|3[2-9]|4[0-4])\b/i);
  const val=m?`Talla ${m[1].toUpperCase()}`:s;
  return {bucket:'sizes',key:'Camiseta / Vestido',val,label:'Tallas → Camiseta / Vestido'};
 }

 // 3. "Le molesta...", "Odia...", "No soporta..."
 if(/^(le molesta|odia|no soporta|no le gusta)\b/i.test(s)){
  const clean=s.replace(/^(le molesta|odia|no soporta|no le gusta)\s*[:,-]?\s*/i,'').trim()||s;
  return {bucket:'more',key:'Le molesta',val:clean.charAt(0).toUpperCase()+clean.slice(1),label:'Su mundo → Le molesta'};
 }

 // 4. Conciertos, espectáculos, programas en vivo (El Hormiguero, Teatro, Gira, Entradas, Avísame cuando...)
 if(/concierto|entrada|hormiguero|teatro|musical|gira|festival|show|mon[oó]logo|circo|av[ií]same cuando|vaya a|celebre en/i.test(l)){
  const city=detectCity(s);
  const clean=s
   .replace(/\s*\b(se celebre en|cuando vaya a|en vivo en|en)\s+[a-záéíóúñ]+$/i,'')
   .replace(/^(av[ií]same cuando|querr[ií]a|quiere|le gustar[ií]a|buscar|comprar)\s+/i,'')
   .replace(/^(unas?\s*)?entradas?\s*(libres?\s*)?(para\s*(ver\s*)?)?/i,'')
   .replace(/^((el|la)\s*)?(concierto|show|programa|evento|teatro|musical|festival|gira)\s+(de\s+)?(?=.+)/i,'')
   .trim()||s;
  return {bucket:'events',key:'Conciertos y Eventos',val:clean.charAt(0).toUpperCase()+clean.slice(1),city,label:`Conciertos y Eventos · Radar en ${city}`};
 }

 // 5. Memoria de conversación ("dijo que...", "me contó que...", "su jefe...", "examen...")
 if(/(dijo|coment[oó]|cont[oó]|jefe|examen|entrevista|m[eé]dico|agobi|estresad|problema|triste)/i.test(l)){
  return {bucket:'notes',key:'Recordatorio en 3 días',val:s,label:'Memoria → Preguntarle en 3 días'};
 }

 // 6. Suegra / Madre / Amiga / Joyas / Serie / Música
 const MR=[
  [/oro|plata|dorad|platead|pendiente|collar/,'Joyas (Oro / Plata)'],
  [/m[uú]sica|canci[oó]n|playlist/,'Música'],
  [/serie|peli/,'Serie / Peli'],
  [/suegra|su madre|madre se llama/,'Nombre de su madre (Suegra)'],
  [/amiga|mejor amiga/,'Mejor amiga']
 ];
 const mMatch=MR.find(x=>x[0].test(l));
 if(mMatch)return {bucket:'more',key:mMatch[1],val:s,label:`Su mundo → ${mMatch[1]}`};

 // 7. Gustos estándar
 const cMatch=CLS.find(c=>c[0].test(l));
 if(cMatch && (cMatch[1]==='favs'||cMatch[1]==='sizes')){
  const clean=s
   .replace(/^(mi|su)\s+/i,'')
   .replace(new RegExp(`^(${cMatch[2]}|perfume|colonia|caf[eé]|dulce|flores|comida|bebida)\\s*(favorit[oa])?\\s*(es)?\\s*(el|la)?\\s*:?\\s*`,'i'),'')
   .trim()||s;
  return {bucket:cMatch[1],key:cMatch[2],val:clean.charAt(0).toUpperCase()+clean.slice(1),label:`${cMatch[1]==='favs'?'Gustos':'Tallas'} → ${cMatch[2]}`};
 }

 // 8. Por defecto: Lista de Regalos
 const cleanWish=s.replace(/^(quiere|le gusta|regalarle|comprar)\s+(un|una|el|la)?\s*/i,'').trim()||s;
 return {bucket:'wish',key:'Lista de Regalos',val:cleanWish.charAt(0).toUpperCase()+cleanWish.slice(1),label:'Lista de Regalos'};
}

function detectCity(text){
 const t=(text||'').toLowerCase();
 for(const c of Object.keys(CITIES_COORDS)){
  if(t.includes(c.toLowerCase()))return c;
 }
 if(/malaga|málaga/.test(t))return "Málaga";
 return S.city||"Madrid";
}

function daysSinceGesture(g,id,todayStr){
 const log=(g.gestureLog||{})[id];
 if(!log)return 999;
 const diff=Math.round((new Date(todayStr)-new Date(log))/DAY);
 return diff<0?0:diff;
}

function selectDailyGestures(g,dateStr=iso(new Date())){
 g.gestureLog=g.gestureLog||{};
 const st=g.stage||'partner',p=phase(g);
 const seedNum=dateStr.split('-').reduce((a,b)=>a+parseInt(b,10),0)+(g.id||1)*7;
 const eligible=GESTURE_POOL.filter(x=>{
  if(!x.st.includes(st))return false;
  if(x.ph!=='all'&&!x.ph.includes(p))return false;
  const elapsed=daysSinceGesture(g,x.id,dateStr);
  return elapsed===0 || elapsed>=x.cd;
 });
 const byCat=c=>eligible.filter(x=>x.cat===c);
 const pick=(arr,offset)=>{
  if(!arr.length)return null;
  const doneToday=arr.find(x=>daysSinceGesture(g,x.id,dateStr)===0);
  if(doneToday)return doneToday;
  return arr[(seedNum+offset)%arr.length];
 };
 const m1=pick(byCat('micro'),0);
 const m2=pick([...byCat('care'),...byCat('date')],3);
 const gifts=byCat('gift');
 let m3=null;
 const doneGiftToday=gifts.find(x=>daysSinceGesture(g,x.id,dateStr)===0);
 if(doneGiftToday)m3=doneGiftToday;
 else if(gifts.length&&(seedNum%4===0||p==='mens'))m3=pick(gifts,1);
 else m3=pick(byCat('micro').filter(x=>!m1||x.id!==m1.id),2);

 const res=[m1,m2,m3].filter(Boolean);
 for(const x of GESTURE_POOL){
  if(res.length>=3)break;
  if(!res.some(r=>r.id===x.id))res.push(x);
 }
 return res.slice(0,3);
}

function toggleGesture(id){ trackEvent('action','gestureCompleted'); vibe(20);
 const g=G(),today=iso(new Date());
 g.gestureLog=g.gestureLog||{};
 const item=GESTURE_POOL.find(x=>x.id===id);
 if(g.gestureLog[id]===today){
  delete g.gestureLog[id];

function getSaint(g){
 if(g.saintDate){const d=new Date(g.saintDate);if(!isNaN(d))return {m:d.getUTCMonth()+1,d:d.getUTCDate(),label:g.saintDate.slice(5)}}

function daysToMD(m,d){
 const n=new Date(),y=n.getFullYear();
 let x=new Date(y,m-1,d);
 if(x<new Date(iso(n)))x=new Date(y+1,m-1,d);
 return Math.ceil((x-new Date(iso(n)))/DAY);
}
function calcAge(bday){
 if(!bday)return 26;
 const b=new Date(bday),n=new Date();
 if(isNaN(b))return 26;
 let a=n.getFullYear()-b.getUTCFullYear();
 const m=n.getMonth()-b.getUTCMonth();
 if(m<0||(m===0&&n.getDate()<b.getUTCDate()))a--;
 return Math.max(18,Math.min(80,a));
}

function toggleNotif(){
 S.notif=!S.notif;save();
 if(S.notif&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(()=>{render();dailyNotif()});
 else render();
}
function dailyNotif(){
 if(!S.notif||!('Notification' in window)||Notification.permission!=='granted')return;
 const g=G(),t=iso(new Date()),br=silentBrain(g);
 const soon=g.dates.some(x=>daysTo(x.d)>=0&&daysTo(x.d)<=1)||br.bd<=1||br.sd<=1;
 const daysSinceLast=S.lastN?Math.round((new Date(t)-new Date(S.lastN))/DAY):999;
 if(daysSinceLast<(S.notifCadence||5)&&!soon)return;
 S.lastN=t;save();
 triggerSmartNotif(soon?'suegra':'gift');
}

let _pinFails=0;
let _lockUntil=0;

function sha256(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  const mathPow = Math.pow, maxWord = mathPow(2, 32);
  let lengthProperty = 'length', i, j, result = '';
  const words = [];
  const asciiBitLength = ascii[lengthProperty] * 8;
  const hash = [], k = [];
  let primeCounter = 0;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii[lengthProperty]; i++) {
    j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
  words[words[lengthProperty]] = (asciiBitLength | 0);
  for (j = 0; j < words[lengthProperty];) {
    const w = words.slice(j, j += 16);
    const oldHash = hash.slice();
    for (i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const temp1 = (hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0
        )) | 0;
      const temp2 = ((rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]))) | 0;
      hash[7] = hash[6]; hash[6] = hash[5]; hash[5] = hash[4];
      hash[4] = (hash[3] + temp1) | 0; hash[3] = hash[2]; hash[2] = hash[1];
      hash[1] = hash[0]; hash[0] = (temp1 + temp2) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j >= 0; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? '0' : '') + b.toString(16);
    }
  }
  return result;
}

function sha256WithSalt(pin, salt) {
  return sha256('barney:' + pin + ':' + salt);
}

function simpleHash(str){
 let h=0x811c9dc5;
 for(let i=0;i<str.length;i++){
  h^=str.charCodeAt(i);
  h=Math.imul(h,0x01000193);
 }
 return 'h_'+(h>>>0).toString(16);
}

function verifyPinInput(val){
 if(Date.now()<_lockUntil){
  const s=Math.ceil((_lockUntil-Date.now())/1000);
  toast('Demasiados intentos. Espera ' + s + 's');
  return;
 }
 let isMatch=false;
 if(S.pin && typeof S.pin==='object' && S.pin.hash && S.pin.salt){
  isMatch = (sha256WithSalt(val, S.pin.salt) === S.pin.hash);
 }else if(typeof S.pin==='string' && S.pin){
  if(S.pin===val || S.pin===simpleHash(val)){
   isMatch=true;
   const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
   S.pin={hash:sha256WithSalt(val, salt), salt};
   save();
  }
 }
 if(isMatch){
  _pinFails=0;
  const lk=document.getElementById('lock');
  if(lk) lk.remove();
  vibe(20);
 }else{
  _pinFails++;
  const inp=document.getElementById('lk');
  if(inp) inp.value='';
  vibe(45);
  if(_pinFails>=5){
   _lockUntil=Date.now()+30000;
   toast('5 intentos fallidos. Bloqueado 30 segundos');
  }else{
   toast('PIN incorrecto (' + (5-_pinFails) + ' intentos restantes)');
  }
 }
}

/* =========================================================================
   SANEADO CENTRAL: evita que apóstrofes, comillas o HTML en nombres/títulos
   rompan botones (onclick) o inyecten código. Se aplica a datos nuevos,
   guardados y restaurados desde copia de seguridad.
   ========================================================================= */
const cleanTxt=(s,max)=>String(s==null?'':s).replace(/[<>"`\\$]/g,'').replace(/'/g,'’').replace(/\s+/g,' ').trim().slice(0,max||80);
function cleanKeys(o){
 if(!o||typeof o!=='object'||Array.isArray(o))return {};
 const r={};
 Object.keys(o).forEach(k=>{const nk=cleanTxt(k,40);if(nk)r[nk]=typeof o[k]==='string'?cleanTxt(o[k],160):o[k];});
 return r;
}
function sanitizeData(){
 if(!S||!Array.isArray(S.girls))return;
 S.girls.forEach(g=>{
  g.name=cleanTxt(g.name,24)||'Ella';
  ['favs','sizes','more'].forEach(f=>{g[f]=cleanKeys(g[f]);});
  ['wish','events','dates','notes'].forEach(f=>{
   if(!Array.isArray(g[f]))g[f]=[];
   g[f].forEach(x=>{
    if(!x||typeof x!=='object')return;
    ['t','tag','city','q','store'].forEach(k=>{if(typeof x[k]==='string')x[k]=cleanTxt(x[k],100);});
   });
  });
  if(!g.done||typeof g.done!=='object')g.done={};
  if(!g.gestureLog||typeof g.gestureLog!=='object')g.gestureLog={};
  if(!g.cycle||g.cycle<21||g.cycle>40)g.cycle=28;
  if(!g.bday||isNaN(new Date(g.bday)))g.bday='1999-06-15';
  if(!g.last||isNaN(new Date(g.last)))g.last=addDays(-10);
 });
 if(typeof S.cur!=='number'||!S.girls[S.cur])S.cur=0;
}
